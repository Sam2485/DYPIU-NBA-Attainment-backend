server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework
  servlet:
    context-path: /api/v1

spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: ${DATABASE_DRIVER:org.postgresql.Driver}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: ${HIBERNATE_DDL_AUTO:validate} # Strictly validate schema against Flyway migrations
    show-sql: false

  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    clean-disabled: true # Production safeguard: prevent accidental flyway:clean
    validate-on-migrate: true # Strict migration checksum verification
    baseline-on-migrate: true
    baseline-version: 0

app:
  jwt:
    secret: ${JWT_SECRET} # Fail-fast: required in production without fallback
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}
    local-dir: ${LOCAL_STORAGE_PATH:/app/storage}
  upload:
    dir: ${UPLOAD_STORAGE_PATH:/app/uploads}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS} # Fail-fast: explicit production origins required
    allowed-methods: GET,POST,PUT,DELETE,PATCH,OPTIONS
    allowed-headers: "*"
    allow-credentials: true

logging:
  level:
    root: INFO
    com.dypiu.nba: INFO
    org.springframework.security: INFO

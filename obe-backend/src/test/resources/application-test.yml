server:
  port: 0
  servlet:
    context-path: /api/v1

spring:
  application:
    name: obe-backend-test

  datasource:
    url: jdbc:h2:mem:dypiu_obe_testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true

  flyway:
    enabled: false

app:
  jwt:
    secret: dypiu_nba_attainment_system_super_secret_jwt_key_2026_java21_spring_boot_production_key
    expiration-ms: 3600000
  storage:
    local-dir: ./target/test-storage
  upload-dir: ./target/test-uploads
  upload:
    dir: ./target/test-uploads
  cors:
    allowed-origins: "*"

version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: dypiu-obe-postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dypiu_obe_db}
      POSTGRES_USER: ${DATABASE_USERNAME:-obe_prod_user}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - obe-internal-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME:-obe_prod_user} -d ${POSTGRES_DB:-dypiu_obe_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./obe-backend
      dockerfile: Dockerfile
    container_name: dypiu-obe-backend-prod
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8080
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-dypiu_obe_db}
      DATABASE_USERNAME: ${DATABASE_USERNAME:-obe_prod_user}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:80,http://localhost:3000,http://localhost:5173}
      UPLOAD_STORAGE_PATH: /app/uploads
      LOCAL_STORAGE_PATH: /app/storage
      DB_POOL_SIZE: 20
    volumes:
      - backend_uploads:/app/uploads
      - backend_storage:/app/storage
    ports:
      - "8080:8080"
    networks:
      - obe-internal-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/api/v1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  frontend:
    build:
      context: ../dypiu-nba-attainment-frontend copy
      dockerfile: Dockerfile
    container_name: dypiu-obe-frontend-prod
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - obe-internal-net

volumes:
  postgres_data:
    driver: local
  backend_uploads:
    driver: local
  backend_storage:
    driver: local

networks:
  obe-internal-net:
    driver: bridge
